<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Opción C — Progresivo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
:root{--bg:rgba(26,28,31,.78);--card:rgba(26,28,31,.78);--border:rgba(255,255,255,.1);--txt:rgba(230,235,230,.92);--muted:#6e7681;--surface:rgba(255,255,255,.06);--surface2:rgba(255,255,255,.1)}
body{font-family:'Inter',sans-serif;color:var(--txt);min-height:100dvh;background:radial-gradient(1200px 500px at 85% -10%,rgba(139,92,246,.16),transparent 55%),radial-gradient(900px 480px at -10% 15%,rgba(101,163,13,.14),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(14,165,233,.10),transparent 55%),linear-gradient(165deg,#0c0d0f 55%,#0e1116);background-attachment:fixed}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
.card{max-width:28rem;margin:2rem auto;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:20px 18px;backdrop-filter:blur(28px) saturate(1.5);box-shadow:0 24px 60px -24px rgba(0,0,0,.6)}
h1{font-size:15px;font-weight:700;margin-bottom:6px}
.sub{font-size:12px;color:var(--muted);margin-bottom:18px}
label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
input{width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--txt);font-size:14px;outline:none}
input:focus{border-color:rgba(132,204,22,.6);box-shadow:0 0 0 3px rgba(132,204,22,.18)}
.field{margin-bottom:14px}
/* chips / bloqueos */
.seg{display:flex;gap:8px;margin-bottom:14px}
.segbtn{flex:1;min-height:44px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center}
.segbtn.on{background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff;border:none;box-shadow:0 8px 20px -8px rgba(132,204,22,.6)}
.hint{font-size:11px;color:var(--muted);margin-top:6px}
.btns{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:48px;border-radius:99px;font-size:14px;font-weight:700}
.btn.primary{background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff;box-shadow:0 10px 24px -8px rgba(132,204,22,.55)}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600}
/* categoría como chips en grid */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.chip{min-height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chip.on{background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff;border:none}
</style>
</head>
<body>
<div class="card">
  <h1>➕ Agregar gasto</h1>
  <div class="sub">Completá solo lo que necesites — el formulario se adapta.</div>

  <div class="field">
    <label>¿Qué gastaste?</label>
    <input placeholder="Ej: Alquiler" oninput="onName(this)" />
  </div>

  <div class="field">
    <label>Categoría</label>
    <div class="cats">
      <button class="chip on">🏠 Vivienda</button>
      <button class="chip">💡 Servicios</button>
      <button class="chip">💳 Tarjetas</button>
      <button class="chip">🎉 Eventos</button>
      <button class="chip">🏥 Salud</button>
      <button class="chip">🧾 Impuestos</button>
    </div>
  </div>

  <!-- Seguro pagado? / Monto -->
  <label>¿Está pagado?</label>
  <div class="seg">
    <button class="segbtn on" onclick="seg(this,1)">✓ Pagado</button>
    <button class="segbtn" onclick="seg(this,0)">⏳ Pendiente</button>
  </div>
  <label>¿Cómo cargás el monto?</label>
  <div class="seg" id="tipoSeg">
    <button class="segbtn on" data-modo="ars" onclick="modo(this)">$ ARS</button>
    <button class="segbtn" data-modo="usd" onclick="modo(this)">u$d USD</button>
  </div>

  <!-- Monto ARS -->
  <div class="field" id="fArs">
    <label>Monto en pesos</label>
    <input placeholder="688.000" />
  </div>

  <!-- Monto USD + cotización (escondido al inicio, se revela al elegir USD) -->
  <div class="field" id="fUsd" style="display:none">
    <label>Monto en USD</label>
    <input placeholder="10,90" />
  </div>
  <div class="field" id="fRate" style="display:none">
    <label>Cotización ($)</label>
    <input placeholder="1.200" />
  </div>

  <div class="field">
    <label>Vencimiento</label>
    <input type="date" />
  </div>

  <div class="field">
    <label>Notas</label>
    <input placeholder="Opcional" />
  </div>

  <div class="btns">
    <button class="btn ghost" onclick="alert('Cancelar')">Cancelar</button>
    <button class="btn primary" onclick="alert('Guardado')">✓ Guardar</button>
  </div>
</div>
<script>
function seg(btn, pagado){
  btn.parentElement.querySelectorAll('.segbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}
function modo(btn){
  btn.parentElement.querySelectorAll('.segbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const m = btn.dataset.modo;
  const fArs = document.getElementById('fArs'), fUsd = document.getElementById('fUsd'), fRate = document.getElementById('fRate');
  if (m === 'usd') { fUsd.style.display='block'; fRate.style.display='block'; fArs.style.display='none'; }
  else { fUsd.style.display='none'; fRate.style.display='none'; fArs.style.display='block'; }
}
function onName(inp){ }
</script>
</body>
</html>
