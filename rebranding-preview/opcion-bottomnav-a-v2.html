<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview v2 — Alta fidelidad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="bottomnav-v2.css" />
</head>
<body>
  <header class="hdr">
    <div class="hdr-top">
      <div class="hdr-title">Agosto 2026</div>
      <div class="hdr-resto num">Resto $ 418.500</div>
    </div>
    <div class="hdr-tabs">
      <button class="tab on">📋 Presupuesto</button>
      <button class="tab">💰 Ahorro</button>
    </div>
    <div class="hdr-months">
      <button class="month on">+ Mes</button>
      <button class="month">📋 Agosto</button>
      <button class="month">Julio</button>
      <button class="month">Marzo</button>
      <button class="month">Febrero</button>
    </div>
  </header>

  <main class="scroll">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" placeholder="Buscar gasto…" />
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Confirmado</div><div class="stat-val num">$ 1.896.000</div></div>
      <div class="stat"><div class="stat-label">Proyectado</div><div class="stat-val num">$ 2.081.500</div></div>
      <div class="stat resto"><div class="stat-label">Resto</div><div class="stat-val num">$ 418.500</div></div>
    </div>
    <div class="lista" id="lista"></div>
  </main>

  <nav class="bbar">
    <div class="bi">
      <button class="ni on"><span class="ico">📋</span><span>Presupuesto</span></button>
      <div style="width:58px"></div>
      <button class="ni" id="btnMas"><span class="ico">⋯</span><span>Más</span></button>
    </div>
    <div class="fw">
      <div class="sd" id="sd">
        <button class="si" id="siAdd"><span class="ico" style="background:linear-gradient(135deg,#65a30d,#84cc16)">➕</span>Agregar Gasto</button>
        <button class="si" id="siPhoto"><span class="ico" style="background:linear-gradient(135deg,#8b5cf6,#d946ef)">📷</span>Foto de apuntes</button>
      </div>
      <button class="fab" id="fab">+</button>
    </div>
  </nav>

  <div class="ov" id="ov"></div>

  <div class="sh" id="sh">
    <div class="sh-h"></div>
    <div class="sh-title">Más opciones</div>
    <div id="shItems"></div>
  </div>

  <script src="bottomnav-v2.js"></script>
</body>
</html>
