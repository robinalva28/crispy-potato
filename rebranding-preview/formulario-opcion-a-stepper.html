<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Opción A — Stepper</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
:root{--bg:rgba(26,28,31,.78);--card:rgba(26,28,31,.78);--border:rgba(255,255,255,.1);--txt:rgba(230,235,230,.92);--muted:#6e7681;--surface:rgba(255,255,255,.06);--surface2:rgba(255,255,255,.1)}
body{font-family:'Inter',sans-serif;color:var(--txt);min-height:100dvh;background:radial-gradient(1200px 500px at 85% -10%,rgba(139,92,246,.16),transparent 55%),radial-gradient(900px 480px at -10% 15%,rgba(101,163,13,.14),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(14,165,233,.10),transparent 55%),linear-gradient(165deg,#0c0d0f,#111312 55%,#0e1116);background-attachment:fixed}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
.card{max-width:28rem;margin:2rem auto;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:20px 18px;backdrop-filter:blur(28px) saturate(1.5);box-shadow:0 24px 60px -24px rgba(0,0,0,.6)}
h1{font-size:15px;font-weight:700;margin-bottom:14px}
/* progress */
.steps{display:flex;gap:6px;margin-bottom:18px}
.step{flex:1;height:4px;border-radius:99px;background:var(--surface2)}
.step.on{background:linear-gradient(135deg,#65a30d,#84cc16)}
.step.done{background:linear-gradient(135deg,#10b981,#34d399)}
.titles{display:flex;justify-content:space-between;margin-bottom:16px}
.tt{font-size:16px;font-weight:700}
.ts{font-size:11px;color:var(--muted)}
label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
input,select{width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--txt);font-size:14px;outline:none;margin-bottom:14px}
input:focus,select:focus{border-color:rgba(132,204,22,.6);box-shadow:0 0 0 3px rgba(132,204,22,.18)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cat{min-height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cat.on{background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff;border:none;box-shadow:0 8px 20px -8px rgba(132,204,22,.6)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;min-height:48px;border-radius:99px;font-size:14px;font-weight:700}
.btn.primary{background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff;box-shadow:0 10px 24px -8px rgba(132,204,22,.55)}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600}
.sect{display:none}
.sect.on{display:block}
.tag{margin-top:-8px;margin-bottom:14px;font-size:11px;color:#fbbf24}
</style>
</head>
<body>
<div class="card">
  <h1>✏️ Editar gasto</h1>
  <div class="steps"><div class="step on" id="st1"></div><div class="step" id="st2"></div><div class="step" id="st3"></div></div>
  <div class="titles">
    <div class="tt" id="tt">¿Qué gastaste?</div>
    <div class="ts" id="ts">Paso 1 de 3</div>
  </div>

  <!-- PASO 1 -->
  <div class="sect on" id="p1">
    <label>Nombre *</label>
    <input placeholder="Ej: Alquiler" />
    <label>Categoría</label>
    <div class="cats">
      <button class="cat on">🏠 Vivienda</button>
      <button class="cat">💡 Servicios</button>
      <button class="cat">💳 Tarjetas</button>
      <button class="cat">🎉 Eventos</button>
      <button class="cat">🏥 Salud</button>
      <button class="cat">🧾 Impuestos</button>
      <button class="cat" style="grid-column:span 3">📦 Otros</button>
    </div>
    <div class="btns"><button class="btn primary" onclick="next()">Siguiente →</button></div>
  </div>

  <!-- PASO 2 -->
  <div class="sect" id="p2">
    <label>Monto en pesos (ARS)</label>
    <input placeholder="688.000" />
    <div class="tag">▶ Si dejás en blanco y cargás un estimado, queda "por confirmar"</div>
    <label>Estimado (por confirmar)</label>
    <input placeholder="80.000" />
    <div class="row">
      <div><label>USD (u$d)</label><input placeholder="10,90" /></div>
      <div><label>Cotización ($)</label><input placeholder="1.200" /></div>
    </div>
    <div class="btns">
      <button class="btn ghost" onclick="prev()">← Atrás</button>
      <button class="btn primary" onclick="next()">Siguiente →</button>
    </div>
  </div>

  <!-- PASO 3 -->
  <div class="sect" id="p3">
    <div class="row">
      <div><label>Vencimiento</label><input type="date" /></div>
      <div style="display:flex;align-items:center;justify-content:center;min-height:48px">
        <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0">
          <input type="checkbox" style="width:18px;height:18px;margin:0;accent-color:#10b981" /> Pagado ✓
        </label>
      </div>
    </div>
    <label>Notas</label>
    <input placeholder="Opcional" />
    <div class="btns">
      <button class="btn ghost" onclick="prev()">← Atrás</button>
      <button class="btn primary" onclick="save()">✓ Guardar</button>
    </div>
  </div>
</div>
<script>
let i=1;
function upd(){for(let n=1;n<=3;n++){document.getElementById('st'+n).className='step'+(n<i?' done':n===i?' on':'');document.getElementById('p'+n).className='sect'+(n===i?' on':'');}
const ts=['¿Qué gastaste?','¿Cuánto?','Detalles finales'][i-1];const ss=['Paso 1 de 3','Paso 2 de 3','Paso 3 de 3'][i-1];
document.getElementById('tt').textContent=ts;document.getElementById('ts').textContent=ss;}
function next(){if(i<3){i++;upd()}}
function prev(){if(i>1){i--;upd()}}
function save(){alert('Demo: guardado')}
upd();
</script>
</body>
</html>
