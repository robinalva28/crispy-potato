<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Efecto recompensa — Preview (4 opciones)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
:root{
  --bg:rgba(255,255,255,.82);--card:rgba(255,255,255,.78);--border:rgba(0,0,0,.08);
  --txt:#20241f;--muted:#6b7280;--surface:rgba(0,0,0,.03);--surface-strong:rgba(0,0,0,.06);
  --panel:rgba(255,255,255,.97);
  --accent-lime:#4d7c0f;--accent-emerald:#059669;--accent-violet:#7c3aed;--accent-amber:#b45309;--accent-red:#dc2626;
}
html.dark{
  --bg:rgba(26,28,31,.78);--card:rgba(26,28,31,.78);--border:rgba(255,255,255,.1);
  --txt:rgba(230,235,230,.92);--muted:#6e7681;--surface:rgba(255,255,255,.06);--surface-strong:rgba(255,255,255,.1);
  --panel:rgba(24,27,31,.97);
  --accent-lime:#84cc16;--accent-emerald:#34d399;--accent-violet:#a78bfa;--accent-amber:#fbbf24;--accent-red:#f87171;
}
html.dark body{background:radial-gradient(1200px 500px at 85% -10%,rgba(139,92,246,.16),transparent 55%),radial-gradient(900px 480px at -10% 15%,rgba(101,163,13,.14),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(14,165,233,.10),transparent 55%),linear-gradient(165deg,#0c0d0f,#111312 55%,#0e1116)}
html.light body{background:radial-gradient(1200px 500px at 85% -10%,rgba(167,139,250,.22),transparent 55%),radial-gradient(900px 480px at -10% 15%,rgba(132,204,22,.20),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(14,165,233,.16),transparent 55%),linear-gradient(160deg,#f8faf7,#eef4ea 55%,#eceff8)}
body{font-family:'Inter',sans-serif;color:var(--txt);min-height:100dvh;transition:background .3s}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;min-width:44px;min-height:44px}
.app{height:100dvh;max-height:100dvh;max-width:28rem;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--border)}
.hdr{flex-shrink:0;position:relative;z-index:5;background:var(--card);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border-radius:0 0 28px 28px;padding:12px 16px 0;margin-bottom:-28px}
.hdr h1{font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.hdr h1 .resto{color:var(--accent-lime);font-size:12px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border)}
.chip.on{background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff;border:none;box-shadow:0 8px 20px -8px rgba(132,204,22,.6)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;text-align:center;backdrop-filter:blur(20px)}
.stat .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.5}
.stat .val{font-size:11px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stat.resto{background:linear-gradient(135deg,rgba(132,204,22,.16),rgba(16,185,129,.12));border:1px solid rgba(132,204,22,.25)}
.stat.resto .lbl,.stat.resto .val{color:var(--accent-lime)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:calc(16px + 28px) 12px 20px;margin-top:-28px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.form{background:var(--card);border:2px solid var(--accent-violet);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 24px 60px -24px rgba(0,0,0,.45)}
.form-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:12px}
.form-title .ic{width:32px;height:32px;border-radius:10px;background:var(--surface);color:var(--accent-violet);display:flex;align-items:center;justify-content:center}
label{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:6px}
.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;font-size:14px;color:var(--txt);outline:none;min-height:44px;padding:0 12px}
.input:focus{border-color:var(--accent-lime);box-shadow:0 0 0 3px rgba(132,204,22,.18)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{width:100%;min-height:48px;border-radius:999px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff;box-shadow:0 10px 24px -8px rgba(132,204,22,.55)}
.row{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.row .dot{width:22px;height:22px;border-radius:999px;background:linear-gradient(135deg,#10b981,#34d399);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.row .name{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .sub{display:flex;justify-content:space-between;font-size:11px;opacity:.5;margin-top:2px}
.row .mid{flex:1;min-width:0}
/* ===== Efectos de recompensa ===== */
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(132,204,22,.45),0 0 0 0 rgba(52,211,153,.35)}50%{box-shadow:0 0 0 6px rgba(132,204,22,.12),0 0 24px 4px rgba(52,211,153,.45)}}
.effA.row.locked{animation:glowPulse 1.4s ease-in-out 2}
.confetti{position:absolute;top:50%;left:50%;pointer-events:none;z-index:10}
.confetti i{position:absolute;width:8px;height:8px;border-radius:2px;opacity:0;animation:confettiFly .9s ease-out forwards}
@keyframes confettiFly{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(.4)}}
@keyframes rowSnap{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.02);opacity:1}100%{transform:scale(1)}}
.effC.row.locked{animation:rowSnap .5s cubic-bezier(.34,1.56,.64,1)}
.ring{position:absolute;inset:0;border-radius:16px;pointer-events:none;border:2px solid rgba(132,204,22,.8)}
@keyframes ringExpand{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.06);opacity:0}}
.effC.row.locked .ring{animation:ringExpand .8s ease-out forwards}
@keyframes rowBlink{0%,100%{border-color:var(--border)}30%{border-color:var(--accent-emerald)}60%{border-color:var(--accent-emerald)}}
.effD.row.locked{animation:rowBlink 1s ease-in-out 2}
.effD.row.locked .dot{animation:checkPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes checkPop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:99px;padding:4px;display:flex;gap:4px;box-shadow:0 12px 32px -12px rgba(0,0,0,.5);max-width:calc(100% - 24px);overflow-x:auto}
.seg{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:99px;font-size:12px;font-weight:700;color:var(--muted)}
.seg.on{background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff}
.tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:8px 16px;font-size:11px;color:var(--muted);box-shadow:0 12px 32px -12px rgba(0,0,0,.5);white-space:nowrap}
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div class="app">
  <div class="hdr">
    <h1><span>Agosto 2026 · Presupuesto</span><span class="resto">Resto $1.200.000</span></h1>
    <div class="chips">
      <button class="chip">Ene</button><button class="chip">Feb</button><button class="chip">Mar</button>
      <button class="chip">Abr</button><button class="chip">May</button><button class="chip">Jun</button>
      <button class="chip">Jul</button><button class="chip on">Ago</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="lbl">Confirmado</div><div class="val" id="stConfirmed">$4.800.000</div></div>
      <div class="stat"><div class="lbl">Proyectado</div><div class="val" id="stProjected">$4.800.000</div></div>
      <div class="stat resto"><div class="lbl">Resto</div><div class="val" id="stResto">$1.200.000</div></div>
    </div>
  </div>
  <div class="scroll" id="scroll">
    <div id="formArea">
      <div class="form">
        <div class="form-title"><span class="ic"><i data-lucide="plus" style="width:18px;height:18px"></i></span>Agregar gasto</div>
        <div><label>Nombre *</label><input id="fName" class="input" value="Alquiler" /></div>
        <div class="frow">
          <div><label>Monto ARS ($)</label><input id="fAmount" class="input" value="688.000" /></div>
          <div><label>Categoría</label><select id="fCat" class="input"><option>Vivienda</option><option>Servicios</option><option>Otros</option></select></div>
        </div>
        <button class="btn" id="btnSave"><i data-lucide="check" style="width:16px;height:16px"></i>Guardar</button>
      </div>
    </div>
    <div id="rows"></div>
  </div>
</div>
<div class="tip">Tocá <b>Guardar</b>: scroll a la fila + efecto de recompensa</div>
<script>
const EFFECTS = [
  { key:'A', name:'A · Glow pulsante' },
  { key:'B', name:'B · Confetti' },
  { key:'C', name:'C · Snap + anillo' },
  { key:'D', name:'D · Fila + check pop' },
];
let current = 'A';

const toolbar = document.getElementById('toolbar');
EFFECTS.forEach((e) => {
  const b = document.createElement('button');
  b.className = 'seg' + (e.key === current ? ' on' : '');
  b.textContent = e.name;
  b.onclick = () => setEffect(e.key);
  toolbar.appendChild(b);
});
function setEffect(k){
  current = k;
  toolbar.querySelectorAll('.seg').forEach((b,i)=>{
    b.classList.toggle('on', EFFECTS[i].key === current);
  });
  document.querySelectorAll('.row').forEach(r => r.classList.remove('locked'));
}

let total = 4800000;

function fmt(n){ return '$' + n.toLocaleString('es-AR'); }

function rowHTML(name, amt, cat){
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `
    <div class="dot"><i data-lucide="check" style="width:12px;height:12px;stroke-width:3"></i></div>
    <div class="mid">
      <div class="name">${name}</div>
      <div class="sub"><span>${cat} · gasto</span><span>${fmt(amt)}</span></div>
    </div>
    <span class="amt">${fmt(amt)}</span>
    <span class="ring"></span>
  `;
  return div;
}

function seedRows(){
  const data = [
    { name:'Alquiler', amt:688000, cat:'Vivienda' },
    { name:'Internet', amt:52000, cat:'Servicios' },
    { name:'Supermercado', amt:320000, cat:'Otros' },
  ];
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  data.forEach((d)=>{ rows.appendChild(rowHTML(d.name, d.amt, d.cat)); });
}

function updateStats(added){
  total += added;
  document.getElementById('stConfirmed').textContent = fmt(total);
  document.getElementById('stProjected').textContent = fmt(total);
  document.getElementById('stResto').textContent = fmt(1200000);
}

function fireConfetti(el){
  const host = document.createElement('div');
  host.className = 'confetti';
  const colors = ['#84cc16','#34d399','#a78bfa','#fbbf24'];
  for (let i=0;i<14;i++){
    const p = document.createElement('i');
    const ang = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*60;
    p.style.setProperty('--tx', Math.cos(ang)*dist + 'px');
    p.style.setProperty('--ty', Math.sin(ang)*dist + 'px');
    p.style.setProperty('--rot', (Math.random()*360-180) + 'deg');
    p.style.background = colors[i % colors.length];
    p.style.left = (el.offsetWidth/2) + 'px';
    p.style.top = '50%';
    host.appendChild(p);
  }
  el.appendChild(host);
  setTimeout(()=>host.remove(), 1100);
}

document.getElementById('btnSave').addEventListener('click', ()=>{
  const name = document.getElementById('fName').value.trim();
  const amtRaw = document.getElementById('fAmount').value.replace(/\./g,'').replace(',','.');
  const amt = parseInt(amtRaw,10) || 0;
  if(!name || amt <= 0){ alert('Completá nombre y monto'); return; }
  const cat = document.getElementById('fCat').value;

  // Quitar form con colapso
  const formArea = document.getElementById('formArea');
  formArea.style.transition = 'opacity .2s, height .25s';
  formArea.style.opacity = '0';
  formArea.style.height = '0';
  formArea.style.overflow = 'hidden';
  setTimeout(()=>{ formArea.innerHTML=''; }, 260);

  // Crear fila y agregar al tope de la lista
  const el = rowHTML(name, amt, cat);
  document.getElementById('rows').prepend(el);
  lucide.createIcons();
  updateStats(amt);

  // Scroll suave a la fila
  setTimeout(()=>{
    el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 80);

  // Disparar el efecto elegido justo cuando el scroll llega
  const wait = current === 'C' ? 450 : 600;
  setTimeout(()=>{
    el.classList.add('eff' + current, 'locked');
    if(current==='B') fireConfetti(el);
  }, wait);
});

seedRows();
lucide.createIcons();
</script>
</body>
</html>
