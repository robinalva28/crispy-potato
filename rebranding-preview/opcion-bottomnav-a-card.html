<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Variante A — Bottom bar dentro de la card</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
body{font-family:'Inter',sans-serif;margin:0;height:100%;color:var(--t)}html{height:100%}html.dark{color-scheme:dark}html:not(.dark){--g:rgba(255,255,255,.8);--b:rgba(255,255,255,.75);--t:rgba(28,32,30,.9)}html.dark{--g:rgba(26,28,31,.8);--b:rgba(255,255,255,.1);--t:rgba(230,235,230,.92)}
.bg{background:radial-gradient(1200px 500px at 85% -10%,rgba(139,92,246,.16),transparent 55%),radial-gradient(900px 480px at -10% 15%,rgba(101,163,13,.14),transparent 55%),linear-gradient(165deg,#0c0d0f,#111312 55%,#0e1116)}
.g{background:var(--g);backdrop-filter:blur(24px);border:1px solid var(--b)}.gc{background:var(--g);backdrop-filter:blur(28px);border:1px solid var(--b);box-shadow:0 24px 60px -24px rgba(0,0,0,.6)}
.ca{background:linear-gradient(135deg,#65a30d,#84cc16);box-shadow:0 8px 20px -8px rgba(132,204,22,.6);color:#fff}
.hdr{background:var(--g);backdrop-filter:blur(28px);border-bottom:1px solid var(--b);box-shadow:0 16px 40px -20px rgba(0,0,0,.55)}
/* Estructura: card-shell = layout app, bottom bar DENTRO */
.card{max-width:28rem;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:28px}
.hdr,.bbar{flex-shrink:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{width:4px}.scroll::-webkit-scrollbar-thumb{background:rgba(128,128,128,.25);border-radius:9999px}
.bbar{position:relative;border-top:1px solid var(--b);padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:50}
.bi{display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;opacity:.6;padding:4px 10px}.ni:hover{opacity:1}.ni.on{opacity:1;color:#84cc16}
.fw{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.fab{pointer-events:auto;width:56px;height:56px;border-radius:9999px;background:linear-gradient(135deg,#65a30d,#84cc16);box-shadow:0 12px 28px -8px rgba(132,204,22,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;cursor:pointer;border:3px solid rgba(255,255,255,.12);transition:transform .3s,background .3s}
.fab.open{transform:rotate(45deg);background:linear-gradient(135deg,#d946ef,#8b5cf6)}
.sd{position:absolute;bottom:70px;left:50%;transform:translateX(-50%) scale(.6);transform-origin:bottom center;opacity:0;pointer-events:none;transition:transform .25s,opacity .2s;display:flex;flex-direction:column;align-items:center;gap:10px}
.sd.open{transform:translateX(-50%) scale(1);opacity:1;pointer-events:auto}
.si{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--g);backdrop-filter:blur(24px);border:1px solid var(--b);border-radius:9999px;padding:8px 16px 8px 8px;font-size:13px;font-weight:700;box-shadow:0 12px 32px -12px rgba(0,0,0,.35);white-space:nowrap;cursor:pointer}
.si i{width:34px;height:34px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0;font-style:normal}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}.ov.open{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;background:rgba(16,18,20,.92);backdrop-filter:blur(28px);border-top:1px solid var(--b);border-radius:24px 24px 0 0;box-shadow:0 -24px 60px -24px rgba(0,0,0,.4);transform:translateY(100%);transition:transform .35s;z-index:60;max-width:28rem;margin:0 auto;padding:20px 20px max(20px,env(safe-area-inset-bottom))}
.sh.open{transform:translateY(0)}.sh-h{width:40px;height:4px;border-radius:9999px;background:rgba(128,128,128,.3);margin:0 auto 16px}
.sh-g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sh-i{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:600;opacity:.75;padding:10px 4px;border-radius:16px;cursor:pointer}.sh-i:hover{opacity:1;background:rgba(132,204,22,.08)}
.sh-i i{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--g);border:1px solid var(--b);font-style:normal}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body class="bg" style="margin:0;color:var(--t)">
<div class="card gc">
  <header class="hdr" style="padding:12px 16px 0">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:14px;font-weight:700">AGOSTO 2026</div>
      <div style="font-size:12px;font-weight:600;color:#a3e635" class="num">Resto: $ 418.500</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="ca" style="flex:1;padding:8px;border-radius:9999px;font-size:12px;font-weight:700;border:none">📋 Presupuesto</button>
      <button class="g" style="flex:1;padding:8px;border-radius:9999px;font-size:12px;font-weight:600;border:none">💰 Ahorro</button>
    </div>
    <div style="display:flex;gap:8px;padding:12px 0 8px;overflow-x:auto">
      <button class="ca" style="flex-shrink:0;padding:8px 16px;border-radius:9999px;font-size:12px;font-weight:700;border:none">+ Mes</button>
      <button class="g" style="flex-shrink:0;padding:8px 16px;border-radius:9999px;font-size:12px;border:none">📋 Agosto</button>
      <button class="g" style="flex-shrink:0;padding:8px 16px;border-radius:9999px;font-size:12px;border:none">Julio</button>
    </div>
  </header>

  <!-- Scroll SOLO lista (busqueda + gastos) -->
  <main class="scroll" style="padding:12px 16px">
    <div class="g" style="border-radius:9999px;padding:12px 16px;display:flex;align-items:center;gap:8px">
      <input type="search" placeholder="Buscar gasto…" style="background:transparent;border:none;outline:none;width:100%;font-size:14px;color:var(--t)" />
    </div>
    <div id="lista" style="margin-top:12px;display:flex;flex-direction:column;gap:8px"></div>
  </main>

  <!-- Bottom bar DENTRO de la card + FAB central -->
  <nav class="bbar">
    <div class="bi">
      <button class="ni on"><span style="font-size:16px;line-height:1">📋</span><span>Presupuesto</span></button>
      <div style="width:56px"></div>
      <button class="ni" id="btnMas"><span style="font-size:16px;line-height:1">⋯</span><span>Más</span></button>
    </div>
    <div class="fw">
      <div class="sd" id="sd">
        <button class="si" onclick="alert('Agregar Gasto — demo')"><i style="background:linear-gradient(135deg,#65a30d,#84cc16)">➕</i>Agregar Gasto</button>
        <button class="si" onclick="alert('Foto de apuntes — demo')"><i style="background:linear-gradient(135deg,#8b5cf6,#d946ef)">📷</i>Foto de apuntes</button>
      </div>
      <button class="fab" id="fab">+</button>
    </div>
  </nav>
</div>

<div class="ov" id="ov"></div>

<div class="sh" id="sh">
  <div class="sh-h"></div>
  <div style="font-weight:700;font-size:14px;margin-bottom:12px;padding:0 4px">Más opciones</div>
  <div class="sh-g" id="shGrid"></div>
</div>

<script src="bottom-nav-fab-a.js"></script>
</body>
</html>
