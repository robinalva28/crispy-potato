<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modelo — Bottom App Bar + FAB central + Menú Más</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  html, body { height: 100%; }
  body { overflow: hidden; color: var(--text-1); }
  html { color-scheme: light; }
  html.dark { color-scheme: dark; }
  html:not(.dark) { --glass-bg: rgba(255,255,255,.62); --glass-border: rgba(255,255,255,.65); --text-1: rgba(25,30,27,.9); }
  html.dark { --glass-bg: rgba(26,28,31,.6); --glass-border: rgba(255,255,255,.08); --text-1: rgba(230,235,230,.92); }
  .app-bg-dark { background: radial-gradient(1200px 500px at 85% -10%, rgba(139,92,246,.16), transparent 55%), radial-gradient(900px 480px at -10% 15%, rgba(101,163,13,.14), transparent 55%), radial-gradient(700px 500px at 50% 110%, rgba(14,165,233,.10), transparent 55%), linear-gradient(165deg,#0c0d0f 0%,#111312 55%,#0e1116 100%); }
  .g { background: var(--glass-bg); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); border: 1px solid var(--glass-border); }
  .gc { background: var(--glass-bg); backdrop-filter: blur(28px) saturate(1.5); -webkit-backdrop-filter: blur(28px) saturate(1.5); border: 1px solid var(--glass-border); box-shadow: 0 24px 60px -24px rgba(0,0,0,.6); }
  .chip-active { background: linear-gradient(135deg,#65a30d,#84cc16); box-shadow: 0 8px 20px -8px rgba(132,204,22,.6); color:#fff; }
  .app-shell { height: 100dvh; display: flex; flex-direction: column; }
  .app-header { flex-shrink: 0; }
  .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-thumb { background: rgba(128,128,128,.25); border-radius: 9999px; }
  .bottom-bar { flex-shrink: 0; position: relative; background: var(--glass-bg); backdrop-filter: blur(28px) saturate(1.5); border-top: 1px solid var(--glass-border); box-shadow: 0 -16px 40px -20px rgba(0,0,0,.55); padding-top: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 50; }
  .bottom-bar-inner { display: flex; align-items: center; justify-content: space-between; max-width: 28rem; margin: 0 auto; padding: 0 20px; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 600; opacity: .6; padding: 4px 10px; border-radius: 12px; }
  .nav-item:hover { opacity: 1; }
  .nav-item.active { opacity: 1; color: #84cc16; }
  .fab-wrap { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .fab { pointer-events: auto; width: 58px; height: 58px; border-radius: 9999px; background: linear-gradient(135deg,#65a30d,#84cc16); box-shadow: 0 12px 28px -8px rgba(132,204,22,.6); color:#fff; display:flex; align-items:center; justify-content:center; font-size: 26px; font-weight: 800; transition: transform .3s cubic-bezier(.32,.72,0,1), background .3s ease; z-index: 60; border: 3px solid rgba(255,255,255,.12); cursor: pointer; }
  .fab.open { transform: rotate(45deg); background: linear-gradient(135deg,#d946ef,#8b5cf6); }
  .speed-dial { position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%) scale(.6); transform-origin: bottom center; opacity: 0; pointer-events: none; transition: transform .25s cubic-bezier(.32,.72,0,1), opacity .2s ease; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .speed-dial.open { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
  .speed-dial-item { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--glass-bg); backdrop-filter: blur(24px) saturate(1.4); border: 1px solid var(--glass-border); border-radius: 9999px; padding: 8px 16px 8px 8px; font-size: 13px; font-weight: 700; box-shadow: 0 12px 32px -12px rgba(0,0,0,.35); white-space: nowrap; cursor: pointer; }
  .speed-dial-item .icon { width: 34px; height: 34px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; flex-shrink: 0; }
  .dim-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 55; }
  .dim-overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(16,18,20,.92); backdrop-filter: blur(28px) saturate(1.5); border-top: 1px solid var(--glass-border); border-radius: 24px 24px 0 0; box-shadow: 0 -24px 60px -24px rgba(0,0,0,.4); transform: translateY(100%); transition: transform .35s cubic-bezier(.32,.72,0,1); z-index: 60; max-width: 28rem; margin: 0 auto; padding: 20px 20px max(20px, env(safe-area-inset-bottom)); }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; border-radius: 9999px; background: rgba(128,128,128,.3); margin: 0 auto 16px; }
  .sheet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sheet-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; opacity: .75; padding: 10px 4px; border-radius: 16px; cursor: pointer; }
  .sheet-item:hover { opacity: 1; background: rgba(132,204,22,.08); }
  .sheet-item .icon { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 19px; background: var(--glass-bg); border: 1px solid var(--glass-border); }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="antialiased app-bg-dark">
  <div class="app-shell">
    <!-- Header fijo -->
    <header class="app-header gc relative z-40 px-4 pt-3">
      <div class="flex items-center justify-between gap-2">
        <div class="text-sm font-bold">AGOSTO 2026</div>
        <div class="text-xs num font-semibold" style="color:#a3e635">Resto: $ 418.500</div>
      </div>
      <div class="flex gap-2 mt-3">
        <button class="flex-1 px-4 py-2 rounded-full text-xs font-bold chip-active">📋 Presupuesto</button>
        <button class="flex-1 px-4 py-2 rounded-full text-xs font-semibold g">💰 Ahorro</button>
      </div>
    </header>
    <!-- Scroll SOLO lista -->
    <main class="scroll-area px-4 py-3 space-y-3">
      <div class="g rounded-full px-4 py-3 flex items-center gap-2">
        <svg class="w-4 h-4 opacity-40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
        <input type="search" placeholder="Buscar gasto…" class="w-full bg-transparent text-sm outline-none" />
      </div>
      <div class="space-y-2 pb-4" id="lista-gastos"></div>
    </main>
    <!-- BOTTOM APP BAR: FIJA abajo -->
    <nav class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="nav-item active"><span class="text-base leading-none">📋</span><span>Presupuesto</span></button>
        <div class="w-[58px]"></div>
        <button class="nav-item" id="btn-mas"><span class="text-base leading-none">⋯</span><span>Más</span></button>
      </div>
      <div class="fab-wrap">
        <div class="speed-dial" id="speedDial">
          <button class="speed-dial-item" onclick="alert('Nuevo gasto — demo')"><span class="icon" style="background:linear-gradient(135deg,#65a30d,#84cc16)">➕</span>Agregar Gasto</button>
          <button class="speed-dial-item" onclick="alert('Foto de apuntes — demo')"><span class="icon" style="background:linear-gradient(135deg,#8b5cf6,#d946ef)">📷</span>Foto de apuntes</button>
        </div>
        <button class="fab" id="fab">+</button>
      </div>
    </nav>
  </div>

  <!-- Overlay para cerrar FAB/Sheet -->
  <div class="dim-overlay" id="dimOverlay"></div>

  <!-- Bottom Sheet "Más" -->
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="font-bold text-sm mb-3 px-1">Más opciones</div>
    <div class="sheet-grid" id="sheet-grid"></div>
  </div>

  <script src="bottom-nav-fab.js"></script>
</body>
</html>
