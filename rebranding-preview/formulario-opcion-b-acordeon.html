<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Opción B — Acordeón por secciones</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
:root{--bg:rgba(26,28,31,.78);--card:rgba(26,28,31,.78);--border:rgba(255,255,255,.1);--txt:rgba(230,235,230,.92);--muted:#6e7681;--surface:rgba(255,255,255,.06);--surface2:rgba(255,255,255,.1);--lime:#84cc16}
body{font-family:'Inter',sans-serif;color:var(--txt);min-height:100dvh;background:radial-gradient(1200px 500px at 85% -10%,rgba(139,92,246,.16),transparent 55%),radial-gradient(900px 480px at -10% 15%,rgba(101,163,13,.14),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(14,165,233,.10),transparent 55%),linear-gradient(165deg,#0c0d0f,#111312 55%,#0e1116);background-attachment:fixed}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
.card{max-width:28rem;margin:2rem auto;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:18px;backdrop-filter:blur(28px) saturate(1.5);box-shadow:0 24px 60px -24px rgba(0,0,0,.6)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.h1{font-size:15px;font-weight:700}
.sect{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden}
.sect.open{border-color:rgba(132,204,22,.4)}
.sect-head{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;width:100%}
.sect-head .ico{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2);font-size:14px;flex-shrink:0}
.sect-head .tt{font-size:13px;font-weight:600;flex:1;text-align:left}
.sect-head .chev{font-size:12px;color:var(--muted);transition:transform .2s}
.sect.open .chev{transform:rotate(180deg)}
.sect-body{display:none;padding:2px 14px 14px}
.sect.open .sect-body{display:block}
label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.06em}
label:first-child{margin-top:0}
input,select{width:100%;min-height:46px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--txt);font-size:14px;outline:none}
input:focus{border-color:rgba(132,204,22,.6);box-shadow:0 0 0 3px rgba(132,204,22,.18)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;min-height:46px;font-size:13px;font-weight:500;margin-top:10px}
.chk input{width:18px;height:18px;accent-color:#10b981;margin:0}
.btns{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:48px;border-radius:99px;font-size:14px;font-weight:700}
.btn.primary{background:linear-gradient(135deg,#65a30d,#84cc16);color:#fff;box-shadow:0 10px 24px -8px rgba(132,204,22,.55)}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="h1">✏️ Editar gasto</div>
    <button class="btn ghost" style="min-height:36px;padding:0 14px;font-size:12px" onclick="alert('Cancelar')">Cancelar</button>
  </div>

  <!-- Sección 1: Datos básicos -->
  <div class="sect open" onclick="toggle(this)">
    <div class="sect-head">
      <span class="ico">🏷️</span><span class="tt">Datos básicos</span><span class="chev">▾</span>
    </div>
    <div class="sect-body">
      <label>Nombre *</label>
      <input placeholder="Ej: Alquiler" />
      <label>Categoría</label>
      <select><option>🏠 Vivienda</option><option>💡 Servicios</option><option>💳 Tarjetas</option></select>
    </div>
  </div>

  <!-- Sección 2: Montos -->
  <div class="sect open" onclick="toggle(this)">
    <div class="sect-head">
      <span class="ico">💰</span><span class="tt">Montos</span><span class="chev">▾</span>
    </div>
    <div class="sect-body">
      <div class="row">
        <div><label>ARS ($)</label><input placeholder="688.000" /></div>
        <div><label>Estimado</label><input placeholder="80.000" /></div>
      </div>
      <div class="row">
        <div><label>USD (u$d)</label><input placeholder="10,90" /></div>
        <div><label>Cotización ($)</label><input placeholder="1.200" /></div>
      </div>
      <div class="chk"><input type="checkbox" checked /> Pagado ✓</div>
    </div>
  </div>

  <!-- Sección 3: Extras -->
  <div class="sect" onclick="toggle(this)">
    <div class="sect-head">
      <span class="ico">📎</span><span class="tt">Extras</span><span class="chev">▾</span>
    </div>
    <div class="sect-body">
      <label>Vencimiento</label>
      <input type="date" />
      <label>Notas</label>
      <input placeholder="Opcional" />
      <label>Factura</label>
      <button class="btn ghost" style="min-height:44px;width:100%" onclick="alert('Escanear 📷')">📷 Escanear factura</button>
    </div>
  </div>

  <div class="btns">
    <button class="btn primary" onclick="alert('Guardado')">✓ Guardar</button>
  </div>
</div>
<script>
function toggle(el){ el.classList.toggle('open'); }
</script>
</body>
</html>
